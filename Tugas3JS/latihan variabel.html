<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan JavaScript</title>
</head>
<body>
    <h1>Latihan JavaScript - Cek Console Browser</h1>
    <p>Tekan <strong>F12</strong> atau klik kanan lalu pilih <strong>Inspect -> Console</strong> untuk melihat hasilnya.</p>

    <script>
        // Task 1: Biodata Sederhana
        let nama = "Budi";
        let umur = 16;
        let siswa = true;

        console.log("=== TASK 1: BIODATA SEDERHANA ===");
        console.log("Nama:", nama);
        console.log("Umur:", umur);
        console.log("Status Siswa:", siswa);

        // Task 2: Mengubah Nilai Ujian
        let nilai = 70;
        console.log("\n=== TASK 2: MENGUBAH NILAI UJIAN ===");
        console.log("Nilai awal:", nilai);

        nilai = 85;
        console.log("Nilai baru:", nilai);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media dan Layout</title>
    <link rel="icon" href="Assets/WhatsApp Image 2026-10-29 at 09.31.20.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --ink: #14122a;
            --panel: #1e1b3f;
            --line: #38336b;
            --text: #ece9ff;
            --muted: #a9a4d6;
            --mint: #5fd4c4;
            --rose: #ff7aa8;
            --radius: 20px;
        }

        * { box-sizing: border-box; margin: 0; }

        body {
            font-family: "DM Sans", system-ui, sans-serif;
            line-height: 1.6;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 85% -10%, rgba(255, 122, 168, .18), transparent 60%),
                radial-gradient(800px 500px at 0% 10%, rgba(95, 212, 196, .14), transparent 60%),
                var(--ink);
            background-attachment: fixed;
            min-height: 100vh;
        }

        .wrap {
            width: min(1040px, 100% - 2.5rem);
            margin-inline: auto;
            padding-block: clamp(2rem, 6vw, 4.5rem);
        }

        /* Header */
        header { margin-bottom: clamp(2rem, 5vw, 3.5rem); }

        h1 {
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            font-weight: 800;
            font-size: clamp(2.6rem, 8vw, 5.5rem);
            line-height: 1;
            letter-spacing: -.03em;
        }

        .lead {
            margin-top: 1rem;
            max-width: 52ch;
            color: var(--muted);
            font-size: 1.1rem;
        }

        /* Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 1.5rem;
        }

        .card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card h2 {
            font-family: "Bricolage Grotesque", system-ui, sans-serif;
            font-weight: 500;
            font-size: 1.35rem;
            letter-spacing: -.01em;
        }

        .card p { color: var(--muted); font-size: .95rem; }

        .span-7 { grid-column: span 7; }
        .span-5 { grid-column: span 5; }
        .span-12 { grid-column: span 12; }

        /* Media */
        img, video, iframe {
            display: block;
            width: 100%;
            border-radius: 12px;
            background: #0c0b1d;
        }

        img { height: auto; object-fit: cover; }

        .ratio { aspect-ratio: 16 / 9; }
        .ratio video, .ratio iframe { height: 100%; border: 0; }

        audio { width: 100%; accent-color: var(--mint); }

        .audio-card { justify-content: space-between; }

        .disc {
            width: 120px;
            aspect-ratio: 1;
            border-radius: 50%;
            background:
                radial-gradient(circle, var(--ink) 0 14%, transparent 15%),
                conic-gradient(from 20deg, var(--mint), var(--rose), var(--mint));
            box-shadow: 0 0 0 8px rgba(255, 255, 255, .04);
            align-self: center;
        }

        footer {
            margin-top: 2.5rem;
            color: var(--muted);
            font-size: .9rem;
        }

        /* Responsif */
        @media (max-width: 760px) {
            .span-7, .span-5 { grid-column: span 12; }
            .disc { width: 96px; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header>
            <h1>Media dan Layout</h1>
            <p class="lead">Gambar, audio, video, dan embed YouTube dalam satu halaman yang rapi dan responsif.</p>
        </header>

        <main class="grid">
            <section class="card span-7">
                <h2>Gambar</h2>
                <img src="Assets/pikirkan secara logika -idealis.jpg" alt="Gambar bertema berpikir secara logika dan idealis" loading="lazy">
            </section>

            <section class="card audio-card span-5">
                <h2>Audio</h2>
                <div class="disc" aria-hidden="true"></div>
                <div>
                    <p>Kembali Pulang &ndash; Suara Kayu feat. Feby Putri</p>
                    <audio controls preload="metadata">
                        <source src="Assets/Kembali Pulang - Suara Kayu feat. Feby Putri - senandung.mp3" type="audio/mpeg">
                        Browser kamu tidak mendukung elemen audio.
                    </audio>
                </div>
            </section>

            <section class="card span-12">
                <h2>Video</h2>
                <div class="ratio">
                    <video controls preload="metadata">
                        <source src="Assets/MALING AYAM - Vernalta (1080p, h264).mp4" type="video/mp4">
                        Browser kamu tidak mendukung elemen video.
                    </video>
                </div>
            </section>

            <!-- tag embed/iframe -->
            <section class="card span-12">
                <h2>Video YouTube</h2>
                <div class="ratio">
                    <iframe
                        src="https://www.youtube.com/embed/dUV0erbERvg?si=hM3Zv-ZuD2-jTZuu"
                        title="YouTube video player"
                        loading="lazy"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin"
                        allowfullscreen></iframe>
                </div>
            </section>
        </main>

        <footer>Halaman latihan HTML: media dan layout.</footer>
    </div>
</body>
</html>

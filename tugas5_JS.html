<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        hitung 1 sampai 10
        for( let a = 1; a<= 10; a++){
            console.log (a);
        } //hasil 1 sampai 10

        angka mundur 5 sampai 1
        for( let a = 5; a >= 1; a--){
            console.log(a);
        }
        console.log ("mulai"); //hasil angka 5 sampai 1 dan mulai

        angka 1 dan 0
        let angka = 1;
        let total = 0;
        console.log(angka);
        console.log(total); //hasil 1 dan 0

        menjumlah seluruh angka
        let total = 0;
        for ( let a = 1; a <= 5; a++){
            total += a;
        }
        console.log(total); //hasil 15
    </script>
</body>
</html>
